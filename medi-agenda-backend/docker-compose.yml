version: "3"

services:
  api:
    container_name: nest-api-medi-agenda
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
      npx prisma migrate dev &&
      npm start
      "
